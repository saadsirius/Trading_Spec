name: Build Docs
on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}
jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/transformers
            ~/.cache/huggingface
          key: transformers-${{ runner.os }}-v1
      - run: npm ci || npm i
      - run: npm run doc:generate
      - run: npm run doc:prompts
      - run: npm run doc:embed
      - uses: actions/upload-artifact@v4
        with:
          name: project-knowledge
          path: |
            knowledge.json
            knowledge.md
            .cursor-prompts.md
            vector/knowledge_embeddings.json
