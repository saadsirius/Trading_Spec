apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: alpaca-iq-slo-alerts
  namespace: alpaca-iq
spec:
  groups:
    - name: alpaca-iq-slo-alerts
      rules:
        # Fast burn (2% over 5m => paging)
        - alert: SLOErrorBudgetBurnFast
          expr: (sum(rate(http_server_requests_total{job="alpaca-iq", code=~"5.."}[5m])) / sum(rate(http_server_requests_total{job="alpaca-iq"}[5m]))) > 0.02
          for: 10m
          labels:
            severity: page
            service: alpaca-iq
            slo: availability
          annotations:
            summary: "High error budget burn (fast)"
            description: "5xx ratio >2% for 10m ({{ $value | printf \"%.2f\" }})"
            runbook_url: "https://github.com/your-org/alpaca-auto-trading-app/blob/main/RUNBOOK.md"
            
        # Slow burn (0.5% over 1h => ticket)
        - alert: SLOErrorBudgetBurnSlow
          expr: (sum(rate(http_server_requests_total{job="alpaca-iq", code=~"5.."}[1h])) / sum(rate(http_server_requests_total{job="alpaca-iq"}[1h]))) > 0.005
          for: 2h
          labels:
            severity: ticket
            service: alpaca-iq
            slo: availability
          annotations:
            summary: "Elevated error budget burn (slow)"
            description: "5xx ratio >0.5% for 2h ({{ $value | printf \"%.2f\" }})"
            
        # Latency SLO breach
        - alert: SLOLatencyHigh
          expr: histogram_quantile(0.95, sum(rate(http_server_request_duration_seconds_bucket{job="alpaca-iq"}[5m])) by (le)) > 2
          for: 5m
          labels:
            severity: warning
            service: alpaca-iq
            slo: latency
          annotations:
            summary: "High latency detected"
            description: "95th percentile latency is {{ $value | printf \"%.2f\" }}s"
            
        # High error rate
        - alert: HighErrorRate
          expr: sum(rate(http_server_requests_total{job="alpaca-iq", code=~"5.."}[5m])) > 10
          for: 2m
          labels:
            severity: critical
            service: alpaca-iq
          annotations:
            summary: "High error rate detected"
            description: "Error rate is {{ $value | printf \"%.2f\" }} errors/sec"
            
        # Pod down
        - alert: PodDown
          expr: up{job="alpaca-iq"} == 0
          for: 1m
          labels:
            severity: critical
            service: alpaca-iq
          annotations:
            summary: "Pod is down"
            description: "Pod {{ $labels.instance }} is down"
