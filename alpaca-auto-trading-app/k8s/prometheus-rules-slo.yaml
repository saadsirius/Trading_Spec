apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: alpaca-iq-slo
  namespace: alpaca-iq
spec:
  groups:
    - name: alpaca-iq-slo
      rules:
        - record: job:http_requests:rate5m
          expr: sum(rate(http_server_requests_total{job="alpaca-iq"}[5m]))
        - record: job:http_errors:rate5m
          expr: sum(rate(http_server_requests_total{job="alpaca-iq", code=~"5.."}[5m]))
        - record: job:error_ratio:5m
          expr: job:http_errors:rate5m / job:http_requests:rate5m
        - record: job:http_requests:rate1h
          expr: sum(rate(http_server_requests_total{job="alpaca-iq"}[1h]))
        - record: job:http_errors:rate1h
          expr: sum(rate(http_server_requests_total{job="alpaca-iq", code=~"5.."}[1h]))
        - record: job:error_ratio:1h
          expr: job:http_errors:rate1h / job:http_requests:rate1h
        - record: job:http_latency:p50
          expr: histogram_quantile(0.50, sum(rate(http_server_request_duration_seconds_bucket{job="alpaca-iq"}[5m])) by (le))
        - record: job:http_latency:p95
          expr: histogram_quantile(0.95, sum(rate(http_server_request_duration_seconds_bucket{job="alpaca-iq"}[5m])) by (le))
        - record: job:http_latency:p99
          expr: histogram_quantile(0.99, sum(rate(http_server_request_duration_seconds_bucket{job="alpaca-iq"}[5m])) by (le))
