apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: alpaca-iq
  namespace: alpaca-iq
spec:
  replicas: 3
  strategy:
    canary:
      canaryService: alpaca-iq-canary
      stableService: alpaca-iq-stable
      trafficRouting:
        nginx:
          stableIngress: alpaca-iq
      steps:
        - setWeight: 10
        - pause:
            duration: 2m
        - setWeight: 30
        - pause:
            duration: 5m
        - setWeight: 50
        - pause:
            duration: 10m
        - setWeight: 100
      analysis:
        templates:
          - templateName: success-rate-check
        args:
          - name: service
            value: alpaca-iq-canary
  selector:
    matchLabels:
      app: alpaca-iq
  template:
    metadata:
      labels:
        app: alpaca-iq
    spec:
      containers:
        - name: web
          image: ghcr.io/your-org/alpaca-auto-trading-app:latest
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: NODE_ENV
              value: "production"
            - name: BASE_URL
              value: "https://app.example.com"
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /api/health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: alpaca-iq-stable
  namespace: alpaca-iq
spec:
  ports:
    - port: 80
      targetPort: 3000
      protocol: TCP
      name: http
  selector:
    app: alpaca-iq
---
apiVersion: v1
kind: Service
metadata:
  name: alpaca-iq-canary
  namespace: alpaca-iq
spec:
  ports:
    - port: 80
      targetPort: 3000
      protocol: TCP
      name: http
  selector:
    app: alpaca-iq
---
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: success-rate-check
  namespace: alpaca-iq
spec:
  args:
    - name: service
  metrics:
    - name: success-rate
      interval: 30s
      successCondition: result[0] >= 0.95
      failureLimit: 3
      provider:
        prometheus:
          address: http://prometheus.monitoring.svc.cluster.local:9090
          query: |
            sum(rate(http_server_requests_total{service="{{args.service}}", code!~"5.."}[5m])) /
            sum(rate(http_server_requests_total{service="{{args.service}}"}[5m]))
