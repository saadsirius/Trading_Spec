apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: alpaca-iq
  namespace: alpaca-iq
  annotations:
    kubernetes.io/ingress.class: nginx
    # Rate limiting
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
    nginx.ingress.kubernetes.io/rate-limit-connections: "10"
    nginx.ingress.kubernetes.io/rate-limit-requests: "100"
    # Per-user rate limiting
    nginx.ingress.kubernetes.io/auth-type: basic
    nginx.ingress.kubernetes.io/auth-secret: basic-auth
    nginx.ingress.kubernetes.io/auth-realm: 'Authentication Required'
    # WAF rules
    nginx.ingress.kubernetes.io/enable-modsecurity: "true"
    nginx.ingress.kubernetes.io/enable-owasp-core-rules: "true"
    nginx.ingress.kubernetes.io/modsecurity-snippet: |
      SecRuleEngine On
      SecAuditEngine RelevantOnly
      SecAuditLogParts ABIJDEFHZ
      SecRequestBodyAccess On
      SecResponseBodyAccess Off
      # Custom rules for trading app
      SecRule ARGS "@detectSQLi" "id:1001,phase:2,block,msg:'SQL Injection Attack Detected'"
      SecRule ARGS "@detectXSS" "id:1002,phase:2,block,msg:'XSS Attack Detected'"
      SecRule REQUEST_URI "@contains /api/" "id:1003,phase:1,pass,ctl:ruleEngine=On"
    # Security headers
    nginx.ingress.kubernetes.io/configuration-snippet: |
      add_header X-Frame-Options DENY always;
      add_header X-Content-Type-Options nosniff always;
      add_header X-XSS-Protection "1; mode=block" always;
      add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
      add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://api.openai.com https://*.polygon.io; frame-ancestors 'none';" always;
spec:
  tls:
    - hosts:
        - app.example.com
      secretName: alpaca-iq-tls
  rules:
    - host: app.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: alpaca-iq
                port:
                  number: 80
---
apiVersion: v1
kind: Secret
metadata:
  name: basic-auth
  namespace: alpaca-iq
type: Opaque
