apiVersion: kustomize.toolkit.fluxcd.io/v1beta2
kind: Kustomization
metadata:
  name: alpaca-iq-app
  namespace: flux-system
spec:
  interval: 5m
  sourceRef:
    kind: GitRepository
    name: alpaca-iq-repo
  path: "./k8s"
  prune: true
  wait: true
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: alpaca-iq
      namespace: alpaca-iq
  timeout: 5m
---
apiVersion: source.toolkit.fluxcd.io/v1beta2
kind: GitRepository
metadata:
  name: alpaca-iq-repo
  namespace: flux-system
spec:
  interval: 1m
  url: https://github.com/your-org/alpaca-auto-trading-app
  branch: main
  ref:
    branch: main
