apiVersion: v1
kind: Secret
metadata:
  name: alertmanager-main
  namespace: monitoring
type: Opaque
stringData:
  alertmanager.yaml: |
    global:
      resolve_timeout: 5m
      slack_api_url: 'https://hooks.slack.com/services/XXX/YYY/ZZZ'
    
    route:
      group_by: ['alertname', 'service']
      group_wait: 10s
      group_interval: 10s
      repeat_interval: 1h
      receiver: 'slack'
      routes:
        - match:
            severity: critical
          receiver: 'slack-critical'
          group_wait: 5s
          repeat_interval: 30m
        - match:
            severity: page
          receiver: 'slack-pager'
          group_wait: 5s
          repeat_interval: 1h
        - match:
            severity: warning
          receiver: 'slack-warning'
          group_wait: 30s
          repeat_interval: 2h
        - match:
            severity: ticket
          receiver: 'slack-ticket'
          group_wait: 1m
          repeat_interval: 4h
    
    receivers:
      - name: 'slack'
        slack_configs:
          - channel: '#alerts'
            title: 'Alpaca IQ Alert'
            text: '{{ range .Alerts }}{{ .Annotations.summary }}{{ end }}'
            send_resolved: true
            
      - name: 'slack-critical'
        slack_configs:
          - channel: '#critical-alerts'
            title: '🚨 CRITICAL: Alpaca IQ'
            text: |
              {{ range .Alerts }}
              *Alert:* {{ .Annotations.summary }}
              *Description:* {{ .Annotations.description }}
              *Service:* {{ .Labels.service }}
              *Severity:* {{ .Labels.severity }}
              {{ end }}
            send_resolved: true
            
      - name: 'slack-pager'
        slack_configs:
          - channel: '#on-call'
            title: '📞 PAGE: Alpaca IQ'
            text: |
              {{ range .Alerts }}
              *Alert:* {{ .Annotations.summary }}
              *Description:* {{ .Annotations.description }}
              *Runbook:* {{ .Annotations.runbook_url }}
              {{ end }}
            send_resolved: true
            
      - name: 'slack-warning'
        slack_configs:
          - channel: '#warnings'
            title: '⚠️ WARNING: Alpaca IQ'
            text: '{{ range .Alerts }}{{ .Annotations.summary }}{{ end }}'
            send_resolved: true
            
      - name: 'slack-ticket'
        slack_configs:
          - channel: '#tickets'
            title: '🎫 TICKET: Alpaca IQ'
            text: '{{ range .Alerts }}{{ .Annotations.summary }}{{ end }}'
            send_resolved: true
