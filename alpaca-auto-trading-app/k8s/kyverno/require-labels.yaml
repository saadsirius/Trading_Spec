apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-labels
spec:
  validationFailureAction: enforce
  rules:
    - name: require-owner-team
      match:
        any:
          - resources:
              kinds: ["Deployment","StatefulSet","DaemonSet","Job","CronJob"]
      validate:
        message: "owner and team labels are required"
        pattern:
          metadata:
            labels:
              owner: "?*"
              team: "?*"
